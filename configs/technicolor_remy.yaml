
model_params:
    sh_degree: 2
    flow_loss_type: 'warp'
    flow_batch: 16
    flow_scale: 0.8
    update_mask: "viewspace_diff"
    update_loss: "mse"
    gaussian_update_thresh: 1.0e-3
    pixel_update_thresh: 0.001
    dilate_size: 48
    depth_init: False
    depth_thresh: 0.1
    adaptive_render: True
    adaptive_update_period: 0
    max_frames: 300
    seed: 0

    gate_temp: 0.3
    gate_gamma: -0.5
    gate_eta: 1.01
    gate_lr: 0.1
    gate_lambda_l2: 0.0
    gate_lambda_l0: 0.01

    lambda_depth: 0.0
    lambda_depthssim: 0.3
    depth_pix_range: 20
    depth_num_comp: 3
    depth_tolerance: 0.01
    depth_pair_int: 300
    depth_from_iter: 4000
    depth_until_iter: 10000

    # fill these in for your wandb logging
    # wandb_project: 
    # wandb_entity: 
    wandb_tags: 'default'
    use_wandb: False
    test_indices: [10]                # Technicolor, cam10 as test view
    
# Octree_LoD Configurations
quantize_params:
    anchor_quant_type: 'decoder_identity'

    offset_quant_type: 'none'
    offset_gate_params: 'on'

    f_rest_quant_type: 'sq'
    f_rest_latent_dim: 4
    f_rest_latent_scale_norm: 'none'
    f_rest_ldecode_matrix: 'learnable'
    f_rest_ldec_std: 1.0e-1

    f_dc_quant_type: 'sq_res'
    f_dc_latent_dim: 8
    f_dc_latent_scale_norm: 'none'
    f_dc_ldecode_matrix: 'learnable'
    f_dc_ldec_std: 1.0e-4

    rot_quant_type: 'sq_res'
    rot_latent_dim: 6
    rot_latent_scale_norm: 'none'
    rot_ldecode_matrix: 'learnable'
    rot_ldec_std: 1.0e-2

    op_quant_type: 'sq_res'
    op_latent_dim: 3
    op_latent_scale_norm: 'none'
    op_ldecode_matrix: 'dft'
    op_ldec_std: 1.0e-4

    sc_quant_type: 'sq_res'
    sc_latent_dim: 8
    sc_latent_scale_norm: 'none'
    sc_ldecode_matrix: 'learnable'
    sc_ldec_std: 1.0e-3

opt_params_initial:
    epochs: 4000 
    opacity_reset_interval: 600
    densify_until_epoch: 0.8
    densify_grad_threshold: 0.0003
    position_lr_max_steps: 12000
    f_rest_ldecs_lr: 1.0e-3
    f_rest_lr_scaling: 5.0
    lambda_flow: 0.0
    lambda_tv: 0.1

opt_params_rest:
    epochs_rest: 10

    offset_ldecs_lr_rest: 1.0e-3
    offset_lr_scaling_rest: 10.0
    position_lr_init_rest: 0.0005
    
    f_dc_ldecs_lr_rest: 1.0e-3
    f_dc_lr_scaling_rest: 5.0
    features_dc_lr_rest: 0.0025

    rot_ldecs_lr_rest: 1.0e-3
    rot_lr_scaling_rest: 0.5
    rotation_lr_rest: 0.05

    op_ldecs_lr_rest: 1.0e-4
    op_lr_scaling_rest: 1.0

    sc_ldecs_lr_rest: 1.0e-4
    sc_lr_scaling_rest: 1.0
    scaling_lr_rest: 0.01

    lambda_flow_rest: 0.0
    lambda_tv_rest: 0.1

    densify_until_epoch_rest: 0.8
    densification_interval_rest: 2
    densify_grad_threshold_rest: 0.00125
    calc_dense_stats_rest: 4
    percent_dense_rest: 0.01
    min_opacity_rest: 0.01
    size_threshold_rest: 20

opt_params_lod:
    iterations: 7_000
    position_lr_init: 0.0
    position_lr_final: 0.0
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 40_000
    
    offset_lr_init: 0.01
    offset_lr_final: 0.0001
    offset_lr_delay_mult: 0.01
    offset_lr_max_steps: 8_000

    feature_lr: 0.0025
    opacity_lr: 0.05
    scaling_lr: 0.005
    rotation_lr: 0.001

    lambda_dssim: 0.2
    lambda_dreg: 0.01

    lambda_normal: 0.0
    normal_start_iter: 7_000
    lambda_dist: 0.0
    dist_start_iter: 3_000
    
    start_stat: 500
    update_from: 500
    coarse_iter: 4000
    coarse_factor: 1.5
    update_interval: 100
    update_until: 7000
    overlap: True
    densification: True

    min_opacity: 0.05
    success_threshold: 0.8
    densify_grad_threshold: 0.0002
    update_ratio: 0.2
    extra_ratio: 0.25
    extra_up: 0.02

    padding: 0.0
    n_offsets: 1
    fork: 2
    visible_threshold: 0.9
    dist2level: 'round'
    base_layer: 16
    progressive: True
    extend: 1.1
    dist_ratio: 0.999
    levels: -1
    init_level: -1
    log_base: 6

    frz_anchor: "none"
    frz_offset: "none" # ["none","st","all"]
    frz_f_dc: "none"  
    frz_f_rest: "none"  
    frz_sc: "none"  
    frz_rot: "none" 
    frz_op: "none"  